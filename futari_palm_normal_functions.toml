# Function overrides for the palm_normal module.
# 0x88085F7C is a real function whose PDATA-derived size is bogus (2105724),
# causing codegen to crash. Name-only override => CONFIG authority, registered
# before PDATA, so the PDATA loop skips it and discovery uses natural boundaries.

[functions."0x88085F7C"]
name = "sub_88085F7C"

# 0x881E8F28 falls in a gap between sub_881E8CF0 and sub_881E8F48.
# hirow_abnormal calls sub_88150A58 with lr = 0x881E8F28, expecting to
# return here. Name-only override => CONFIG authority, discovery uses
# natural boundaries instead of PDATA.

[functions."0x881E8F28"]
name = "sub_881E8F28"

# 0x881E7200 falls in a gap between sub_881E6E50 and sub_881E7208.
# Name-only override => CONFIG authority, discovery uses natural boundaries.

[functions."0x881E7200"]
name = "sub_881E7200"

# sub_880EBB80 (0x880EBCAC switch) auto-detection mis-scans the bounds check
# (matches an earlier cmpwi instead of cmplwi r10,9), truncating the table to
# 2 of 10 entries. Manual override with the full jump table (palm image
# 0xEBCB0: 0x880EBCE4..0x880EC254).

# 0x881B2978 gap fix

# 0x881B2978 falls in a gap between auto-discovered functions.
# Name-only override => CONFIG authority, discovery uses natural boundaries.

[functions."0x881B2978"]
name = "sub_881B2978"


