# futari.toml - settings template (the game writes/reads futari.toml next to the exe).
#
# The live copy lives next to futari.exe (out/build/win-amd64-release/futari.toml,
# or wherever the exe and DLLs are) and is staged from this template on the first
# build/launch (scripts/stage_config.cmake + launch.bat), copy-if-missing: the
# live file is never overwritten by a build, so F4 saves and local edits survive.
# Editing this template after the live copy exists does NOT propagate - delete
# the live copy or re-edit via F4 to re-sync. (Backported from the mushi port.)
#
# Saves are diff-only: default-equal cvars are omitted.
# d3d12_submit_on_primary_buffer_end = false is the validated slowdown fix
# (per-game XENIA_CANARY / rexglue transfer validated on 435A07D7 captures;
# SDK default flipped to false in beebs1998-repo/rexglue-sdk main), so its
# line is normally absent from a written file: absence == default == fix
# active. The explicit line below pins it for stale-SDK safety.
d3d12_submit_on_primary_buffer_end = false
# Deployed-release logging: a fixed rotating file instead of the default
# sequential futari_NNN.log naming, which mints a new file every session and
# never prunes old ones (unbounded disk growth). This caps logs at ~12 MB
# total while keeping [error]/[critical] lines for crash diagnosis. Per-run
# capture is still available via --log-level/--log-file on the command line.
log_file = "logs/futari.log"
log_max_file_size_mb = 4
log_max_files = 3
log_level = "error"

window_width = 1280
window_height = 720
fullscreen = false
mnk_mode = true
keybind_a = "Z"
keybind_b = "X"
keybind_x = "C"
keybind_y = "A"
keybind_left_trigger = "Q"
keybind_right_trigger = "E"
keybind_left_shoulder = "S"
keybind_right_shoulder = "D"
keybind_lstick_up = "Up"
keybind_lstick_down = "Down"
keybind_lstick_left = "Left"
keybind_lstick_right = "Right"
keybind_lstick_press = "U"
keybind_rstick_up = "I"
keybind_rstick_down = "K"
keybind_rstick_left = "J"
keybind_rstick_right = "L"
keybind_rstick_press = "O"
keybind_start = "1"
profile_name = "REX"
gpu_plugin = "xenos"
audio_maxqframes = 32

# DLC unlock does not need license_mask: per-package license bits come from
# the 4-byte tails appended to user_data\0000000000000000\435A07D7\Headers\
# 00000002\*.header, and XamContentCreateEx returns those when the game
# opens each package (XamContentGetLicenseMask's cvar path is not needed;
# see TRACKING.md Iteration 23). Caveat from cvar.cpp: a [Section] TOML
# block is parsed as "Section_key", so a [Kernel] section would land on the
# nonexistent cvar `Kernel_license_mask` and be silently dropped on the next
# auto-save. Base games do not require any of this.
