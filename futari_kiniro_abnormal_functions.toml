# Function overrides for the kiniro_abnormal module.

# sub_880EEFA8 (Black Label game-start path) crashed with the recompiler's
# UD2 trap (0xC000001D) at host RVA 0x271149: auto-detection mis-scanned the
# jump-table bounds check (matched the earlier cmpwi cr6,r11,1 inside the same
# function instead of the true cmplwi r10,9), truncating the table to 2 of 10
# entries. Manual override with the full jump table (kiniro_abnormal image
# 0x880EF0D4, ten entries 0x880EF108..0x880EF5BC; dispatch bctr at 0x880EF0D0,
# table at anchor+4, same shape as the palm_normal 0x880EBCAC table).
# See TRACKING.md Iteration 20.

[[switch_tables]]
address = 0x880EF0D0
register = 11
labels = [
    0x880EF108,
    0x880EF124,
    0x880EF154,
    0x880EF1A8,
    0x880EF1E0,
    0x880EF1EC,
    0x880EF448,
    0x880EF524,
    0x880EF564,
    0x880EF5BC,
]

# 0x881E4CE0 gap fix — Black Label game-start crash #2 (TRACKING.md Iteration
# 20): "call to invalid or unregistered function 0x881E4CE0" when starting a
# BL Original-mode stage. Gap sits in the 8-byte sliver before the registered
# 0x881E4CE8 (loop-twin/mid-entry class, see the 0x881B8368 pattern; the
# stage-1 gap family 0x881E4E88 is the next cluster up).
[functions."0x881E4CE0"]
name = "sub_881E4CE0"

# 0x881AFB10 gap fix — Black Label Original-mode stage-2 crash (TRACKING.md
