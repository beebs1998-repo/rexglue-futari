# BL Original ver (= kiniro_abnormal) run, stage 2. New first-time gap in the
# shared stage-2 code range below the already-registered 0x881B2978/
# 0x881B83D0 pair; discovered only in this module so far (register per-module;
# watch for shifted twins when other BL modes/characters reach stage 2).
[functions."0x881AFB10"]
name = "sub_881AFB10"

