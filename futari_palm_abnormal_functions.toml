# Function overrides for the palm_abnormal module.
# 0x880DD7B4 (bctr at guest 0x880DD7B4, dispatch base 0x880DD7B8) is the
# character-select / mode switch. Auto-detection mis-scans the bounds check,
# truncating the table to 2 of 10 entries (cases 0 and 1 only), so any other
# index traps (host crash). The full jump table lives in the decoded image at
# guest 0x880E41B8 (10 entries, matches bounds check cmplwi r10,9).

# 0x881B2978 gap fix

# 0x881B2978 falls in a gap between auto-discovered functions.
# Name-only override => CONFIG authority, discovery uses natural boundaries.

[functions."0x881B2978"]
name = "sub_881B2978"


# 0x881B83D0 gap fix

# 0x881B83D0 falls in a gap between auto-discovered functions.
# Name-only override => CONFIG authority, discovery uses natural boundaries.

[functions."0x881B83D0"]
name = "sub_881B83D0"


