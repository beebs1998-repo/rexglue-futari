# sub_880EBB90 game-select switch truncation fix
# Auto-detection mis-scans the jump-table bounds check (cmplwi r10,9), matching
# the earlier cmpwi instead, truncating to 2 of 10 entries. Same shape as the
# hirow_normal 0x880EBCAC table (labels shifted +8). Dispatch bctr at
# 0x880EBCB4; static table at anchor+4 (guest 0x880EBCB8), read from the
# decoded module image. Reached via the DLC game-select path.
# See TRACKING.md Iteration 20.

