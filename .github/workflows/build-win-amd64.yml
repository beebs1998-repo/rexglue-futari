name: Build Windows AMD64

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out source (with SDK submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Add LLVM to PATH
        run: |
          Get-ChildItem "C:\Program Files\LLVM\bin\clang*.exe" | Select-Object -First 1
          Add-Content $env:GITHUB_PATH "C:\Program Files\LLVM\bin"

      - name: Validate regenerated code (embedded-trap gate)
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/validate_codegen.ps1

      - name: Configure
        run: cmake --preset win-amd64-release

      - name: Build
        run: cmake --build --preset win-amd64-release --parallel 4

      - name: Collect release files
        run: |
          mkdir win-amd64-release
          Get-ChildItem out\build\win-amd64-release -File |
            Where-Object { $_.Name -match '\.exe$|\.dll$' } |
            Copy-Item -Destination win-amd64-release

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: futari-win-amd64
          path: win-amd64-release
          if-no-files-found: error
