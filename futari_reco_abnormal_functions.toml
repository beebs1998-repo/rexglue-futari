# Function overrides for the reco_abnormal module.
# sub_880EC760 (0x880EC854 switch) auto-detection mis-scans the bounds check
# (matches the earlier cmpwi r11,7 instead of cmplwi r10,9), truncating the
# table to 2 of 10 entries. Manual override with the full jump table.

# 0x881B2978 falls in a gap between auto-discovered functions.
# Name-only override => CONFIG authority, discovery uses natural boundaries.

[functions."0x881B2978"]
name = "sub_881B2978"

