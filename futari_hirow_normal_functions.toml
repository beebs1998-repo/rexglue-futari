# sub_880EBB88 game-select switch truncation fix
# Auto-detection mis-scans the jump-table bounds check (cmplwi r10,9), matching
# the earlier cmpwi instead, truncating to 2 of 10 entries. Same shape as the
# palm_normal 0x880EBCAC table (identical labels). Dispatch bctr at 0x880EBCAC;
# static table at anchor+4 (guest 0x880EBCB0), read from the decoded module
# image. Reached via the DLC game-select path. See TRACKING.md Iteration 20.

[[switch_tables]]
address = 0x880EBCAC
register = 11
labels = [
    0x880EBCE4,
    0x880EBD00,
    0x880EBD30,
    0x880EBD84,
    0x880EBDBC,
    0x880EBDC8,
    0x880EBFD8,
    0x880EC0B4,
    0x880EC0F4,
    0x880EC14C,
]